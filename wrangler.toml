name = "botspace-dashboard"
main = "worker.js"
type = "javascript"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Account ID
account_id = "b1b843ec85bc39a3a4d370ba4f84f17a"

# Zone ID for espacios.me
zone_id = "9c0f37d6c3a1e4b8f7d2a9c1e5b3f8a2"

# Routes for the worker
routes = [
  { pattern = "espacios.me/bot", zone_name = "espacios.me" },
  { pattern = "espacios.me/bot/*", zone_name = "espacios.me" },
  { pattern = "espacios.me/botspace", zone_name = "espacios.me" },
  { pattern = "espacios.me/botspace/*", zone_name = "espacios.me" }
]

# Environment variables
[env.production]
vars = { ENVIRONMENT = "production" }

# Build configuration
[build]
command = "pnpm build"
cwd = "."
watch_paths = ["client/src/**/*.tsx", "client/src/**/*.ts", "client/src/**/*.css"]

# Triggers
[triggers]
crons = []
