name: Deploy BotSpace Dashboard to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "18"
  PNPM_VERSION: "10.4.1"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build project
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/
          retention-days: 1

  test:
    name: Test Build
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist/

      - name: Verify build artifacts
        run: |
          echo "Checking dist directory..."
          ls -la dist/
          
          echo "Checking public directory..."
          ls -la dist/public/ || echo "public directory not found"
          
          echo "Checking index.html..."
          test -f dist/public/index.html && echo "✓ index.html found" || echo "✗ index.html not found"
          
          echo "Checking JavaScript bundle..."
          ls -la dist/public/assets/*.js 2>/dev/null | head -5 || echo "No JS files found"
          
          echo "Checking CSS bundle..."
          ls -la dist/public/assets/*.css 2>/dev/null | head -5 || echo "No CSS files found"

  deploy:
    name: Deploy to Cloudflare
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist/

      - name: Install Wrangler
        run: pnpm add -g wrangler

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler deploy worker.js \
            --name botspace-dashboard \
            --account-id $CLOUDFLARE_ACCOUNT_ID \
            --compat-date 2024-04-01 \
            --compatibility-flags nodejs_compat

      - name: Deployment Summary
        run: |
          echo "✓ Deployment completed successfully!"
          echo "Dashboard URL: https://espacios.me/bot"
          echo "Legacy URL: https://espacios.me/botspace (redirects to /bot)"

      - name: Create deployment annotation
        if: success()
        run: |
          echo "::notice title=Deployment Success::BotSpace Dashboard deployed to https://espacios.me/bot"
